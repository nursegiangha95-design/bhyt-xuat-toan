<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Theo dõi xuất toán BHYT</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  input:disabled, select:disabled { background: transparent !important; border-color: transparent !important; color: #334155; }
  .badge { border-radius: 6px; padding: 2px 8px; font-size: 12px; border: 1px solid; }
</style>
</head>
<body class="bg-slate-50 text-slate-800">

<!-- ============================================================
     CẤU HÌNH: điền URL và anon key của project Supabase RIÊNG
     (lấy ở Project Settings > API). anon key là public, an toàn
     để đưa vào code phía client — quyền hạn thật sự được
     Postgres Row Level Security (đã chạy ở bhyt_schema.sql) quyết định.
     ============================================================ -->
<script>
  const SUPABASE_URL = 'https://YOUR-PROJECT-REF.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';
</script>

<div id="app" class="min-h-screen"></div>

<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const QUARTERS = ['Q1', 'Q2', 'Q3', 'Q4'];
const STATUS_OPTIONS = ['Đang giải trình', 'Đã giải trình thành công', 'Đã giải trình một phần', 'Đã giải trình thất bại'];
const STATUS_CLASS = {
  'Đang giải trình': 'bg-slate-100 text-slate-700 border-slate-300',
  'Đã giải trình thành công': 'bg-emerald-50 text-emerald-700 border-emerald-300',
  'Đã giải trình một phần': 'bg-amber-50 text-amber-700 border-amber-300',
  'Đã giải trình thất bại': 'bg-red-50 text-red-700 border-red-300',
};

const app = document.getElementById('app');
const fmtVND = (n) => (n === null || n === undefined || isNaN(n)) ? '—' : new Intl.NumberFormat('vi-VN').format(Math.round(n));
const fmtPct = (n) => (n === null || n === undefined || !isFinite(n)) ? '—' : (n * 100).toFixed(2) + '%';
const qKey = (q, y) => `${q}-${y}`;

let state = {
  user: null, role: 'viewer',
  categories: [], periods: [], details: [],
  tab: 'overview', quarterFilter: 'ALL',
  chartRef: null,
};

// ---------------------------------------------------------------
// AUTH
// ---------------------------------------------------------------
async function init() {
  if (SUPABASE_URL.includes('YOUR-PROJECT-REF') || SUPABASE_ANON_KEY.includes('YOUR-ANON')) {
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md bg-white border border-amber-200 rounded-xl shadow-sm p-6 text-center">
          <h1 class="text-lg font-semibold text-amber-700 mb-2">Chưa cấu hình Supabase</h1>
          <p class="text-sm text-slate-600">Mở file <code class="bg-slate-100 px-1 rounded">index.html</code>, tìm 2 dòng <code class="bg-slate-100 px-1 rounded">SUPABASE_URL</code> và <code class="bg-slate-100 px-1 rounded">SUPABASE_ANON_KEY</code> ở đầu file, thay bằng giá trị thật lấy từ Project Settings → API trong Supabase (xem file hướng dẫn triển khai, Bước 1–3).</p>
        </div>
      </div>`;
    return;
  }
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) { await afterLogin(session); } else { renderLogin(); }
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') renderLogin();
    });
  } catch (e) {
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md bg-white border border-red-200 rounded-xl shadow-sm p-6 text-center">
          <h1 class="text-lg font-semibold text-red-700 mb-2">Không kết nối được tới Supabase</h1>
          <p class="text-sm text-slate-600 mb-2">Kiểm tra lại SUPABASE_URL và SUPABASE_ANON_KEY đã đúng chưa, và project Supabase có đang chạy không.</p>
          <p class="text-xs text-slate-400 font-mono break-all">${(e && e.message) || String(e)}</p>
        </div>
      </div>`;
  }
}

function renderLogin(errorMsg) {
  app.innerHTML = `
    <div class="min-h-screen flex items-center justify-center px-4">
      <div class="w-full max-w-sm bg-white border border-slate-200 rounded-xl shadow-sm p-6">
        <h1 class="text-lg font-semibold text-blue-900 mb-1">Theo dõi xuất toán BHYT</h1>
        <p class="text-sm text-slate-500 mb-4">Đăng nhập để xem hoặc chỉnh sửa dữ liệu.</p>
        ${errorMsg ? `<div class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-2 mb-3">${errorMsg}</div>` : ''}
        <form id="login-form" class="space-y-3">
          <div>
            <label class="text-xs text-slate-500">Email</label>
            <input required type="email" id="login-email" class="mt-1 w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="text-xs text-slate-500">Mật khẩu</label>
            <input required type="password" id="login-password" class="mt-1 w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
          </div>
          <button type="submit" class="w-full bg-blue-900 text-white rounded-md py-2 text-sm font-medium hover:bg-blue-800">Đăng nhập</button>
        </form>
        <p class="text-xs text-slate-400 mt-4">Chưa có tài khoản? Liên hệ quản trị viên để được cấp email/mật khẩu.</p>
      </div>
    </div>`;
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { renderLogin('Sai email hoặc mật khẩu.'); return; }
    await afterLogin(data.session);
  });
}

async function afterLogin(session) {
  state.user = session.user;
  const { data: profile } = await sb.from('bhyt_user_profiles').select('role').eq('id', session.user.id).single();
  state.role = profile?.role || 'viewer';
  await loadAll();
  render();
}

async function logout() {
  await sb.auth.signOut();
  state = { user: null, role: 'viewer', categories: [], periods: [], details: [], tab: 'overview', quarterFilter: 'ALL' };
}

// ---------------------------------------------------------------
// DATA LOADING
// ---------------------------------------------------------------
async function loadAll() {
  const [{ data: cats }, { data: pers }, { data: dets }] = await Promise.all([
    sb.from('bhyt_categories').select('*').order('code'),
    sb.from('bhyt_periods').select('*').order('year').order('quarter'),
    sb.from('bhyt_details').select('*'),
  ]);
  state.categories = cats || [];
  state.periods = pers || [];
  state.details = dets || [];
}

// ---------------------------------------------------------------
// DERIVED DATA
// ---------------------------------------------------------------
function quarterSummaries() {
  return state.periods.map((p) => {
    const rows = state.details.filter((d) => d.quarter === p.quarter && d.year === p.year);
    const finalizedCost = rows.reduce((s, r) => s + (r.finalized_cost || 0), 0);
    const notifiedCost = rows.reduce((s, r) => s + (r.notified_cost || 0), 0);
    const notified = rows.reduce((s, r) => s + (r.notified || 0), 0);
    const finalized = rows.reduce((s, r) => s + (r.finalized || 0), 0);
    return {
      key: qKey(p.quarter, p.year), label: `${p.quarter}/${p.year}`, quarter: p.quarter, year: p.year,
      revenue: p.revenue || 0, finalizedCost, notifiedCost, notified, finalized,
      rateVsRevenue: p.revenue ? finalizedCost / p.revenue : null,
      explainByCount: notified ? (notified - finalized) / notified : null,
      explainByCost: notifiedCost ? (notifiedCost - finalizedCost) / notifiedCost : null,
    };
  }).sort((a, b) => a.year - b.year || QUARTERS.indexOf(a.quarter) - QUARTERS.indexOf(b.quarter));
}

function grandTotal(qs) {
  const revenue = qs.reduce((s, q) => s + q.revenue, 0);
  const finalizedCost = qs.reduce((s, q) => s + q.finalizedCost, 0);
  const notifiedCost = qs.reduce((s, q) => s + q.notifiedCost, 0);
  const notified = qs.reduce((s, q) => s + q.notified, 0);
  const finalized = qs.reduce((s, q) => s + q.finalized, 0);
  return {
    finalizedCost, rateVsRevenue: revenue ? finalizedCost / revenue : null,
    explainByCount: notified ? (notified - finalized) / notified : null,
    explainByCost: notifiedCost ? (notifiedCost - finalizedCost) / notifiedCost : null,
    notified, finalized,
  };
}

function categorySummaries() {
  const byCode = new Map();
  state.categories.forEach((c) => byCode.set(c.code, { code: c.code, name: c.name, quarterCount: 0, finalizedCost: 0 }));
  state.details.forEach((d) => {
    if (!byCode.has(d.code)) byCode.set(d.code, { code: d.code, name: '(chưa khai báo)', quarterCount: 0, finalizedCost: 0 });
    const rec = byCode.get(d.code);
    rec.quarterCount += 1;
    rec.finalizedCost += d.finalized_cost || 0;
  });
  return Array.from(byCode.values());
}

// ---------------------------------------------------------------
// MAIN RENDER
// ---------------------------------------------------------------
function render() {
  const canEdit = state.role === 'editor';
  app.innerHTML = `
    <div class="bg-blue-900 text-white">
      <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 class="text-lg font-semibold">Theo dõi xuất toán BHYT theo chuyên đề</h1>
          <p class="text-blue-200 text-xs mt-0.5">${state.user.email} · vai trò: <span class="font-semibold">${canEdit ? 'Được sửa' : 'Chỉ xem'}</span></p>
        </div>
        <div class="flex items-center gap-2">
          ${canEdit ? `<input type="file" id="import-file" accept=".xlsx,.xls" class="hidden" />
          <button id="btn-import" class="bg-blue-800 hover:bg-blue-700 border border-blue-600 rounded-md px-3 py-2 text-sm font-medium">Import Excel</button>` : ''}
          <button id="btn-export" class="bg-white text-blue-900 hover:bg-blue-50 rounded-md px-3 py-2 text-sm font-medium">Export Excel</button>
          <button id="btn-logout" class="border border-blue-600 rounded-md px-3 py-2 text-sm font-medium text-blue-100 hover:bg-blue-800">Đăng xuất</button>
        </div>
      </div>
      <div class="max-w-7xl mx-auto px-6 flex gap-1 border-t border-blue-800">
        ${tabBtn('overview', 'Tổng quan')}
        ${tabBtn('details', 'Chi tiết xuất toán')}
        ${tabBtn('setup', 'Kỳ & Danh mục')}
      </div>
    </div>
    <div id="import-msg"></div>
    <div class="max-w-7xl mx-auto px-6 py-6" id="tab-content"></div>
  `;
  document.getElementById('btn-logout').onclick = async () => { await logout(); };
  document.getElementById('btn-export').onclick = handleExport;
  if (canEdit) document.getElementById('btn-import').onclick = () => document.getElementById('import-file').click();
  if (canEdit) document.getElementById('import-file').addEventListener('change', handleImport);
  document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  renderTab();
}

function tabBtn(id, label) {
  const active = state.tab === id;
  return `<button data-tab="${id}" class="px-4 py-2.5 text-sm font-medium border-b-2 ${active ? 'border-white text-white' : 'border-transparent text-blue-300 hover:text-white'}">${label}</button>`;
}

function renderTab() {
  const el = document.getElementById('tab-content');
  if (state.tab === 'overview') el.innerHTML = overviewHTML();
  if (state.tab === 'details') el.innerHTML = detailsHTML();
  if (state.tab === 'setup') el.innerHTML = setupHTML();
  attachTabEvents();
  if (state.tab === 'overview') drawChart();
}

// ---------------------------------------------------------------
// OVERVIEW TAB
// ---------------------------------------------------------------
function overviewHTML() {
  const qs = quarterSummaries();
  const gt = grandTotal(qs);
  const cats = categorySummaries();
  const topRepeated = [...cats].filter((c) => c.quarterCount > 0).sort((a, b) => b.quarterCount - a.quarterCount).slice(0, 10);
  const topCost = [...cats].filter((c) => c.finalizedCost > 0).sort((a, b) => b.finalizedCost - a.finalizedCost).slice(0, 10);

  return `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      ${statCard('Tổng chi phí xuất toán', fmtVND(gt.finalizedCost) + ' đ', 'red')}
      ${statCard('Tỉ lệ xuất toán/doanh thu', fmtPct(gt.rateVsRevenue), 'blue')}
      ${statCard('Giải trình thành công (hồ sơ)', fmtPct(gt.explainByCount), 'emerald')}
      ${statCard('Giải trình thành công (tiền)', fmtPct(gt.explainByCost), 'emerald')}
    </div>
    <div class="bg-white border border-slate-200 rounded-lg p-4 mb-6">
      <h3 class="text-sm font-semibold text-slate-700 mb-3">Chi phí xuất toán &amp; tỉ lệ theo quý</h3>
      ${qs.length === 0 ? '<div class="text-sm text-slate-400 py-8 text-center">Chưa có dữ liệu</div>' : '<canvas id="quarter-chart" height="90"></canvas>'}
    </div>
    <div class="grid md:grid-cols-2 gap-6">
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <h3 class="text-sm font-semibold text-slate-700 mb-3">Chuyên đề lặp lại nhiều nhất</h3>
        ${simpleTable(['Mã', 'Tên', 'Số quý'], topRepeated.map((c) => [c.code, c.name, c.quarterCount]))}
      </div>
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <h3 class="text-sm font-semibold text-slate-700 mb-3">Luỹ kế chi phí xuất toán cao nhất</h3>
        ${simpleTable(['Mã', 'Tên', 'Luỹ kế (đ)'], topCost.map((c) => [c.code, c.name, fmtVND(c.finalizedCost)]))}
      </div>
    </div>
  `;
}

function statCard(label, value, tone) {
  const toneMap = { red: 'bg-red-50 border-red-200 text-red-700', blue: 'bg-blue-50 border-blue-200 text-blue-800', emerald: 'bg-emerald-50 border-emerald-200 text-emerald-700' };
  return `<div class="rounded-lg border p-4 ${toneMap[tone]}"><div class="text-xs font-medium uppercase opacity-70">${label}</div><div class="text-2xl font-semibold mt-1.5">${value}</div></div>`;
}

function simpleTable(headers, rows) {
  if (rows.length === 0) return '<div class="text-sm text-slate-400 py-6 text-center">Chưa có dữ liệu</div>';
  return `<table class="w-full text-sm"><thead><tr class="text-left text-slate-500 border-b border-slate-200">${headers.map((h) => `<th class="py-1.5 font-medium">${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr class="border-b border-slate-100">${r.map((c) => `<td class="py-1.5">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function drawChart() {
  const qs = quarterSummaries();
  if (qs.length === 0) return;
  const ctx = document.getElementById('quarter-chart');
  if (!ctx) return;
  if (state.chartRef) state.chartRef.destroy();
  state.chartRef = new Chart(ctx, {
    data: {
      labels: qs.map((q) => q.label),
      datasets: [
        { type: 'bar', label: 'Chi phí xuất toán (tr đ)', data: qs.map((q) => Math.round(q.finalizedCost / 1e6)), backgroundColor: '#dc2626', yAxisID: 'y' },
        { type: 'bar', label: 'Doanh thu (tr đ)', data: qs.map((q) => Math.round(q.revenue / 1e6)), backgroundColor: '#cbd5e1', yAxisID: 'y' },
        { type: 'line', label: 'Tỉ lệ xuất toán (%)', data: qs.map((q) => q.rateVsRevenue !== null ? +(q.rateVsRevenue * 100).toFixed(2) : 0), borderColor: '#1e3a8a', yAxisID: 'y1', tension: 0.3 },
      ],
    },
    options: {
      responsive: true,
      scales: {
        y: { position: 'left', title: { display: true, text: 'triệu đ' } },
        y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '%' } },
      },
    },
  });
}

// ---------------------------------------------------------------
// DETAILS TAB (editable)
// ---------------------------------------------------------------
function detailsHTML() {
  const canEdit = state.role === 'editor';
  const qs = quarterSummaries();
  let rows = state.details;
  if (state.quarterFilter !== 'ALL') rows = rows.filter((d) => qKey(d.quarter, d.year) === state.quarterFilter);
  rows = [...rows].sort((a, b) => (b.finalized_cost || 0) - (a.finalized_cost || 0));

  return `
    <div class="flex items-center justify-between flex-wrap gap-2 mb-4">
      <div class="flex items-center gap-2">
        <label class="text-sm text-slate-600">Xem theo kỳ:</label>
        <select id="quarter-filter" class="border border-slate-300 rounded-md px-2 py-1.5 text-sm bg-white">
          <option value="ALL" ${state.quarterFilter === 'ALL' ? 'selected' : ''}>Tất cả (xếp theo chi phí xuất toán)</option>
          ${qs.map((q) => `<option value="${q.key}" ${state.quarterFilter === q.key ? 'selected' : ''}>${q.label}</option>`).join('')}
        </select>
      </div>
      ${canEdit ? '<button id="btn-add-detail" class="bg-blue-900 text-white rounded-md px-3 py-1.5 text-sm font-medium hover:bg-blue-800">+ Thêm dòng</button>' : ''}
    </div>
    <div class="bg-white border border-slate-200 rounded-lg overflow-x-auto">
      <table class="w-full text-sm min-w-[1000px]">
        <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
          <tr>
            <th class="text-left px-2 py-2">Quý</th><th class="text-left px-2 py-2">Năm</th><th class="text-left px-2 py-2">Mã</th>
            <th class="text-right px-2 py-2">Số TB</th><th class="text-right px-2 py-2">Số XT</th>
            <th class="text-right px-2 py-2">CP thông báo</th><th class="text-right px-2 py-2">CP xuất toán</th>
            <th class="text-left px-2 py-2">Trạng thái</th><th class="text-left px-2 py-2">Ghi chú</th><th></th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((r) => detailRow(r, canEdit)).join('')}
          ${rows.length === 0 ? '<tr><td colspan="10" class="text-center text-slate-400 py-8">Chưa có dữ liệu</td></tr>' : ''}
        </tbody>
      </table>
    </div>
  `;
}

function detailRow(r, canEdit) {
  const dis = canEdit ? '' : 'disabled';
  return `
    <tr class="border-t border-slate-100" data-id="${r.id}">
      <td class="px-2 py-1"><select ${dis} data-field="quarter" class="border border-slate-200 rounded px-1 py-1 w-16">${QUARTERS.map((q) => `<option ${q === r.quarter ? 'selected' : ''}>${q}</option>`).join('')}</select></td>
      <td class="px-2 py-1"><input ${dis} type="number" data-field="year" value="${r.year}" class="border border-slate-200 rounded px-1 py-1 w-20" /></td>
      <td class="px-2 py-1"><select ${dis} data-field="code" class="border border-slate-200 rounded px-1 py-1 w-32 font-mono">${state.categories.map((c) => `<option value="${c.code}" ${c.code === r.code ? 'selected' : ''}>${c.code}</option>`).join('')}</select></td>
      <td class="px-2 py-1"><input ${dis} type="number" data-field="notified" value="${r.notified}" class="border border-slate-200 rounded px-1 py-1 w-16 text-right" /></td>
      <td class="px-2 py-1"><input ${dis} type="number" data-field="finalized" value="${r.finalized}" class="border border-slate-200 rounded px-1 py-1 w-16 text-right" /></td>
      <td class="px-2 py-1"><input ${dis} type="number" data-field="notified_cost" value="${r.notified_cost}" class="border border-slate-200 rounded px-1 py-1 w-28 text-right" /></td>
      <td class="px-2 py-1"><input ${dis} type="number" data-field="finalized_cost" value="${r.finalized_cost}" class="border border-slate-200 rounded px-1 py-1 w-28 text-right" /></td>
      <td class="px-2 py-1"><select ${dis} data-field="status" class="badge ${STATUS_CLASS[r.status] || ''}">${STATUS_OPTIONS.map((s) => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
      <td class="px-2 py-1"><input ${dis} type="text" data-field="note" value="${r.note || ''}" class="border border-slate-200 rounded px-1 py-1 w-32" /></td>
      <td class="px-2 py-1 text-center">${canEdit ? `<button data-del="${r.id}" class="text-slate-400 hover:text-red-600">✕</button>` : ''}</td>
    </tr>`;
}

// ---------------------------------------------------------------
// SETUP TAB (periods + categories)
// ---------------------------------------------------------------
function setupHTML() {
  const canEdit = state.role === 'editor';
  return `
    <div class="grid lg:grid-cols-2 gap-6">
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-slate-700">Kỳ giám định</h3>
          ${canEdit ? '<button id="btn-add-period" class="text-blue-800 hover:text-blue-600 text-sm font-medium">+ Thêm kỳ</button>' : ''}
        </div>
        <table class="w-full text-sm">
          <thead class="text-xs text-slate-500 uppercase"><tr><th class="text-left py-1">Quý</th><th class="text-left py-1">Năm</th><th class="text-right py-1">Doanh thu (đ)</th><th></th></tr></thead>
          <tbody>
            ${state.periods.map((p) => `
              <tr class="border-t border-slate-100" data-id="${p.id}" data-kind="period">
                <td class="py-1.5"><select ${canEdit ? '' : 'disabled'} data-field="quarter" class="border border-slate-200 rounded px-1 py-1 w-16">${QUARTERS.map((q) => `<option ${q === p.quarter ? 'selected' : ''}>${q}</option>`).join('')}</select></td>
                <td class="py-1.5"><input ${canEdit ? '' : 'disabled'} type="number" data-field="year" value="${p.year}" class="border border-slate-200 rounded px-1 py-1 w-20" /></td>
                <td class="py-1.5 text-right"><input ${canEdit ? '' : 'disabled'} type="number" data-field="revenue" value="${p.revenue}" class="border border-slate-200 rounded px-1 py-1 w-36 text-right" /></td>
                <td class="py-1.5 text-center">${canEdit ? `<button data-del-period="${p.id}" class="text-slate-400 hover:text-red-600">✕</button>` : ''}</td>
              </tr>`).join('')}
            ${state.periods.length === 0 ? '<tr><td colspan="4" class="text-center text-slate-400 py-6">Chưa có kỳ nào</td></tr>' : ''}
          </tbody>
        </table>
      </div>
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-slate-700">Danh mục chuyên đề</h3>
          ${canEdit ? '<button id="btn-add-category" class="text-blue-800 hover:text-blue-600 text-sm font-medium">+ Thêm mã</button>' : ''}
        </div>
        <table class="w-full text-sm">
          <thead class="text-xs text-slate-500 uppercase"><tr><th class="text-left py-1">Mã</th><th class="text-left py-1">Tên chuyên đề</th><th class="text-left py-1">Nhóm</th><th></th></tr></thead>
          <tbody>
            ${state.categories.map((c) => `
              <tr class="border-t border-slate-100" data-code="${c.code}" data-kind="category">
                <td class="py-1.5 font-mono">${c.code}</td>
                <td class="py-1.5"><input ${canEdit ? '' : 'disabled'} type="text" data-field="name" value="${c.name || ''}" class="border border-slate-200 rounded px-1 py-1 w-full" /></td>
                <td class="py-1.5"><input ${canEdit ? '' : 'disabled'} type="text" data-field="category_group" value="${c.category_group || ''}" class="border border-slate-200 rounded px-1 py-1 w-28" /></td>
                <td class="py-1.5 text-center">${canEdit ? `<button data-del-category="${c.code}" class="text-slate-400 hover:text-red-600">✕</button>` : ''}</td>
              </tr>`).join('')}
            ${state.categories.length === 0 ? '<tr><td colspan="4" class="text-center text-slate-400 py-6">Chưa có mã nào</td></tr>' : ''}
          </tbody>
        </table>
        ${canEdit ? `<div class="mt-3 pt-3 border-t border-slate-100 flex gap-2">
          <input id="new-cat-code" placeholder="Mã mới (VD: DVT-002)" class="border border-slate-300 rounded px-2 py-1.5 text-sm flex-1" />
          <button id="btn-quick-add-category" class="bg-blue-900 text-white rounded-md px-3 py-1.5 text-sm">Thêm</button>
        </div>` : ''}
      </div>
    </div>
  `;
}

// ---------------------------------------------------------------
// EVENT WIRING + SUPABASE WRITES
// ---------------------------------------------------------------
function attachTabEvents() {
  if (state.tab === 'details') {
    const filterEl = document.getElementById('quarter-filter');
    if (filterEl) filterEl.onchange = (e) => { state.quarterFilter = e.target.value; renderTab(); };
    const addBtn = document.getElementById('btn-add-detail');
    if (addBtn) addBtn.onclick = addDetailRow;
    document.querySelectorAll('#tab-content tr[data-id]').forEach((tr) => {
      tr.querySelectorAll('[data-field]').forEach((input) => {
        input.addEventListener('change', () => saveDetailField(tr.dataset.id, input.dataset.field, input.value));
      });
      const delBtn = tr.querySelector('[data-del]');
      if (delBtn) delBtn.onclick = () => deleteDetailRow(tr.dataset.id);
    });
  }
  if (state.tab === 'setup') {
    const addPeriodBtn = document.getElementById('btn-add-period');
    if (addPeriodBtn) addPeriodBtn.onclick = addPeriodRow;
    const addCatBtn = document.getElementById('btn-add-category');
    if (addCatBtn) addCatBtn.onclick = () => document.getElementById('new-cat-code')?.focus();
    const quickAddCatBtn = document.getElementById('btn-quick-add-category');
    if (quickAddCatBtn) quickAddCatBtn.onclick = quickAddCategory;
    document.querySelectorAll('#tab-content tr[data-kind="period"]').forEach((tr) => {
      tr.querySelectorAll('[data-field]').forEach((input) => input.addEventListener('change', () => savePeriodField(tr.dataset.id, input.dataset.field, input.value)));
      const delBtn = tr.querySelector('[data-del-period]');
      if (delBtn) delBtn.onclick = () => deletePeriod(tr.dataset.id);
    });
    document.querySelectorAll('#tab-content tr[data-kind="category"]').forEach((tr) => {
      tr.querySelectorAll('[data-field]').forEach((input) => input.addEventListener('change', () => saveCategoryField(tr.dataset.code, input.dataset.field, input.value)));
      const delBtn = tr.querySelector('[data-del-category]');
      if (delBtn) delBtn.onclick = () => deleteCategory(tr.dataset.code);
    });
  }
}

async function saveDetailField(id, field, value) {
  const numeric = ['year', 'notified', 'finalized', 'notified_cost', 'finalized_cost'];
  const patch = { [field]: numeric.includes(field) ? Number(value) : value };
  await sb.from('bhyt_details').update(patch).eq('id', id);
  const row = state.details.find((d) => String(d.id) === String(id));
  if (row) Object.assign(row, patch);
}
async function deleteDetailRow(id) {
  await sb.from('bhyt_details').delete().eq('id', id);
  state.details = state.details.filter((d) => String(d.id) !== String(id));
  renderTab();
}
async function addDetailRow() {
  const payload = { quarter: 'Q1', year: new Date().getFullYear(), code: state.categories[0]?.code || null, notified: 0, finalized: 0, notified_cost: 0, finalized_cost: 0, status: STATUS_OPTIONS[0], note: '' };
  const { data, error } = await sb.from('bhyt_details').insert(payload).select().single();
  if (!error) { state.details.push(data); renderTab(); }
}

async function savePeriodField(id, field, value) {
  const patch = { [field]: field === 'quarter' ? value : Number(value) };
  await sb.from('bhyt_periods').update(patch).eq('id', id);
  const row = state.periods.find((p) => String(p.id) === String(id));
  if (row) Object.assign(row, patch);
}
async function deletePeriod(id) {
  await sb.from('bhyt_periods').delete().eq('id', id);
  state.periods = state.periods.filter((p) => String(p.id) !== String(id));
  renderTab();
}
async function addPeriodRow() {
  const payload = { quarter: 'Q1', year: new Date().getFullYear(), revenue: 0 };
  const { data, error } = await sb.from('bhyt_periods').insert(payload).select().single();
  if (!error) { state.periods.push(data); renderTab(); }
}

async function saveCategoryField(code, field, value) {
  await sb.from('bhyt_categories').update({ [field]: value }).eq('code', code);
  const row = state.categories.find((c) => c.code === code);
  if (row) row[field] = value;
}
async function deleteCategory(code) {
  await sb.from('bhyt_categories').delete().eq('code', code);
  state.categories = state.categories.filter((c) => c.code !== code);
  renderTab();
}
async function quickAddCategory() {
  const input = document.getElementById('new-cat-code');
  const code = input.value.trim();
  if (!code) return;
  const { data, error } = await sb.from('bhyt_categories').insert({ code, name: '', category_group: '' }).select().single();
  if (!error) { state.categories.push(data); renderTab(); }
}

// ---------------------------------------------------------------
// IMPORT / EXPORT EXCEL
// ---------------------------------------------------------------
async function handleImport(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const msgEl = document.getElementById('import-msg');
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = (name) => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '' }) : [];

    const cats = sheet('Danh mục chuyên đề')
      .map((r) => ({ code: String(r['Mã chuyên đề'] || '').trim(), name: String(r['Tên chuyên đề'] || '').trim(), category_group: String(r['Nhóm'] || '').trim() }))
      .filter((r) => r.code);
    const pers = sheet('Kỳ giám định')
      .map((r) => ({ quarter: String(r['Quý'] || '').trim(), year: Number(r['Năm']) || null, revenue: Number(r['Tổng doanh thu BHYT quý (đ)']) || 0 }))
      .filter((r) => r.quarter && r.year && !String(r.quarter).startsWith('TỔNG'));
    const dets = sheet('Chi tiết xuất toán')
      .map((r) => ({
        quarter: String(r['Quý'] || '').trim(), year: Number(r['Năm']) || null, code: String(r['Mã chuyên đề'] || '').trim(),
        notified: Number(r['Số thông báo (hồ sơ)']) || 0, finalized: Number(r['Số xuất toán (hồ sơ)']) || 0,
        notified_cost: Number(r['Chi phí thông báo (đ)']) || 0, finalized_cost: Number(r['Chi phí xuất toán (đ)']) || 0,
        status: String(r['Trạng thái giải trình'] || '').trim() || STATUS_OPTIONS[0], note: String(r['Ghi chú'] || '').trim(),
      }))
      .filter((r) => r.quarter && r.year && r.code);

    if (cats.length) await sb.from('bhyt_categories').upsert(cats, { onConflict: 'code' });
    if (pers.length) await sb.from('bhyt_periods').upsert(pers, { onConflict: 'quarter,year' });
    if (dets.length) await sb.from('bhyt_details').upsert(dets, { onConflict: 'quarter,year,code' });

    await loadAll();
    msgEl.innerHTML = `<div class="max-w-7xl mx-auto px-6 pb-3"><div class="bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-md px-3 py-2 text-sm">Đã cộng dồn: ${pers.length} kỳ, ${cats.length} chuyên đề, ${dets.length} dòng chi tiết.</div></div>`;
    renderTab();
  } catch (err) {
    msgEl.innerHTML = `<div class="max-w-7xl mx-auto px-6 pb-3"><div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm">Không đọc được file. Kiểm tra đúng mẫu 3 sheet.</div></div>`;
  } finally {
    e.target.value = '';
    setTimeout(() => { msgEl.innerHTML = ''; }, 6000);
  }
}

function handleExport() {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.categories.map((c) => ({ 'Mã chuyên đề': c.code, 'Tên chuyên đề': c.name, 'Nhóm': c.category_group }))), 'Danh mục chuyên đề');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.periods.map((p) => ({ 'Quý': p.quarter, 'Năm': p.year, 'Tổng doanh thu BHYT quý (đ)': p.revenue }))), 'Kỳ giám định');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.details.map((d) => ({
    'Quý': d.quarter, 'Năm': d.year, 'Mã chuyên đề': d.code, 'Số thông báo (hồ sơ)': d.notified, 'Số xuất toán (hồ sơ)': d.finalized,
    'Chi phí thông báo (đ)': d.notified_cost, 'Chi phí xuất toán (đ)': d.finalized_cost, 'Trạng thái giải trình': d.status, 'Ghi chú': d.note,
  }))), 'Chi tiết xuất toán');
  XLSX.writeFile(wb, `Xuat_toan_BHYT_export_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

init();
</script>
